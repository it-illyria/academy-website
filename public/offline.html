<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Lika Academy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      color: #e8e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      border-radius: 1rem;
      background: rgba(124, 58, 237, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .brand {
      color: #a855f7;
    }
    p {
      color: #8888a0;
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    button {
      padding: 0.75rem 2rem;
      border-radius: 0.75rem;
      border: none;
      background: #7c3aed;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #6d28d9;
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1><span class="brand">Lika</span> Academy</h1>
    <p>
      Nuk keni lidhje interneti.<br>
      Kontrolloni lidhjen tuaj dhe provoni përsëri.
    </p>
    <p style="font-size: 0.8rem;">
      You are offline.<br>
      Check your connection and try again.
    </p>
    <button onclick="window.location.reload()">
      Provo Përsëri / Try Again
    </button>
    <div class="footer">
      Lika Academy — Kamëz, Tirana
    </div>
  </div>
</body>
</html>
